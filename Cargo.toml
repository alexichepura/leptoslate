[workspace]
resolver = "2"
members = [
    "crates/leptoslate-core",
    "crates/leptoslate",
    "examples/demo",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.81"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
leptos = { version = "0.8.22", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1"
send_wrapper = "0.6"
tl = "0.7.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
