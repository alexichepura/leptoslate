[workspace]
resolver = "3"
members = [
    "crates/leptoslate-core",
    "crates/leptoslate",
    "crates/leptoslate-rich",
    "examples/demo",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
# Required by Leptos 0.9 (and by the let-chains we use in edition 2024).
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
leptos = { version = "0.9.0-rc1", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1"
send_wrapper = "0.6"
tl = "0.7.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
