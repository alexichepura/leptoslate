[package]
name = "leptoslate-demo"
description = "Demo application for leptoslate."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
leptoslate = { path = "../../crates/leptoslate" }
leptoslate-rich = { path = "../../crates/leptoslate-rich" }
leptos = { workspace = true, features = ["csr"] }
console_error_panic_hook = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }

[dependencies.web-sys]
workspace = true
features = [
    "DataTransfer",
    "DragEvent",
    "File",
    "FileList",
    "FileReader",
    "HtmlInputElement",
    "Window",
]
